name: Build .so ARMv7

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install NDK
      run: sdkmanager "ndk;25.2.9519653"

    - name: Find jni folder
      run: |
        echo "=== Buscando carpeta jni ==="
        find . -type d -name "jni" 2>/dev/null
        echo "=== Buscando Android.mk ==="
        find . -name "Android.mk" 2>/dev/null
        echo "=== Buscando Application.mk ==="
        find . -name "Application.mk" 2>/dev/null

    - name: Build with ndk-build
      run: |
        export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653
        JNI_PATH=$(find . -type d -name "jni" | head -n 1)
        echo "Compilando desde: $JNI_PATH"
        cd "$JNI_PATH"
        $ANDROID_NDK_HOME/ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=Android.mk APP_ABI=armeabi-v7a

    - name: Upload .so files
      uses: actions/upload-artifact@v4
      with:
        name: mod-menu-so-armv7
        path: |
          **/libs/armeabi-v7a/*.so
          **/obj/local/armeabi-v7a/*.so
