name: Build .so ARMv7

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install NDK
      run: sdkmanager "ndk;25.2.9519653"

    - name: Build ARMv7
      run: |
        export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653
        cd app/src/main/jni
        $ANDROID_NDK_HOME/ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=Android.mk APP_ABI=armeabi-v7a

    - name: Upload .so files
      uses: actions/upload-artifact@v4
      with:
        name: mod-menu-so-armv7
        path: |
          app/src/main/libs/armeabi-v7a/*.so
          app/src/main/obj/local/armeabi-v7a/*.so
